<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartu Proyek</title>
<meta name="description" content="Kartu Proyek: anggaran survey KJPP AF&amp;R">
<meta name="theme-color" content="#496570">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<script>window.KP_API='https://script.google.com/macros/s/AKfycbwCTqDjLD3cFyOMkMcyhLnrV7ORKlEGhM_UukYVEMNhz_DGZ7_4o04WQgVPejawA-ri/exec';window.KP_ENV='staging';
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Kartu Proyek — token sesuai panduan logo AF&R
   biru keabuan #496570 (Pantone 431 C) = warna utama; merah #B61C2F (Pantone 7621 C) = aksen kecil (penanda aktif, badge, error).
   hijau/kuning hanya untuk status. */
:root{--ink:#1A2230;--ink2:#3B4657;--mut:#667085;--line:#D9DEE5;--line2:#E8ECF1;--bg:#F3F5F7;--card:#fff;
  --blue:#496570;--blue-d:#3A515A;--blue-l:#EAF0F2;--brand-red:#B61C2F;--green:#2F6B2A;--green-l:#E7F2E4;--amber:#8A5300;--amber-l:#FCF1DC;--red:#B61C2F;--red-l:#FBEAEC;
  --r:10px;--r-s:6px;--sh:0 1px 2px rgba(26,34,48,.06),0 1px 1px rgba(26,34,48,.04)}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.5 "Plus Jakarta Sans",system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}h2{font-size:16px;margin:0 0 10px;font-weight:700}h3{font-size:13px;margin:16px 0 4px;color:var(--ink2);font-weight:700}
.sub{color:var(--mut);font-size:13px;margin:0 0 16px}
#app{display:none;min-height:100vh}

/* navigasi */
#nav{width:236px;background:var(--card);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 12px;z-index:5}
.brand{padding:0 10px 18px}.brand img{display:block;height:34px;width:auto}.brand .bnama{height:auto;width:100%;max-width:190px;margin:10px 0 14px;opacity:.9}.brand b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em;padding-top:12px;border-top:1px solid var(--line)}.brand span{font-size:12px;color:var(--mut)}
#mtop{display:none}.lglogo{display:block;width:200px;max-width:70%;height:auto;margin:0 0 22px}
#nav .nb{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink2);padding:9px 10px;border-radius:var(--r-s);text-align:left;font-size:14px;font-weight:500;position:relative}
#nav .nb:hover{background:var(--bg)}#nav .nb.on{background:var(--blue-l);color:var(--blue-d);font-weight:700}
#nav .nb.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-red)}
.ic{width:18px;height:18px;flex:none}.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:700;line-height:18px}
.me{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;font-size:12px;color:var(--mut);word-break:break-all}
.me b{display:block;color:var(--ink);font-size:13px}.me button{border:0;background:none;padding:6px 0 0;color:var(--blue);font-size:12px;font-weight:600}
#nav #navMore{display:none}
#main{margin-left:236px;padding:28px 32px 48px;max-width:1360px}

/* dasar */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.3}
.btn:hover{border-color:#B8C1CC;background:#FAFBFC}.btn.b{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.b:hover{background:var(--blue-d)}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.g{background:var(--green);color:#fff;border-color:var(--green)}.btn.r{background:#fff;color:var(--red);border-color:#E3B4B4}
.btn.s{padding:4px 10px;font-size:12px}.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.x{border:0;background:none;color:var(--red);font-size:12px;font-weight:600;padding:2px 0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-DRAFT{background:#EEF1F4;color:#4A5565}.st-MENUNGGU{background:var(--amber-l);color:var(--amber)}.st-DISETUJUI{background:var(--green-l);color:var(--green)}.st-DITOLAK{background:var(--red-l);color:var(--red)}
.st-LUNAS{background:var(--green-l);color:var(--green)}.st-BELUM{background:#fff;color:var(--amber);box-shadow:inset 0 0 0 1px #EBC98A}
.empty{padding:32px 16px;color:var(--mut);text-align:center}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line2);text-align:left;font-size:13px;vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right;white-space:nowrap}.kv td:first-child{color:var(--mut);width:40%}
.tot td{font-weight:700;border-top:1px solid #AEB8C4}.scroll{overflow:auto}
.box{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px;background:#FAFBFC}
.box.act{background:var(--amber-l);border-color:#EBC98A}
.pv{background:var(--blue-l);border-radius:var(--r-s);padding:8px 11px;margin-top:10px;font-size:12.5px;color:var(--blue-d)}
.msg{margin-top:10px;font-size:13px;white-space:pre-line}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* skeleton */
.skel{display:block;height:12px;border-radius:4px;background:linear-gradient(90deg,#E8ECF1 25%,#F3F5F7 50%,#E8ECF1 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* beranda */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.stat .l{font-size:12.5px;color:var(--mut)}.stat .v{font-size:22px;font-weight:700;margin-top:2px}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:22px}
.tq h2{display:flex;justify-content:space-between;align-items:baseline}.tq h2 span{font-size:13px;color:var(--mut);font-weight:600}
.tr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer}.tr:hover .tc{color:var(--blue)}
.tr .tc{flex:1;min-width:0}.tr .tc b{font-size:13px}.tr .tc div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr .tv{text-align:right;font-size:13px;white-space:nowrap}
.tr .tv small{display:block;color:var(--mut);font-size:11.5px}

/* daftar */
.dtabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--line)}
.dtabs button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs button.on{color:var(--blue-d);border-bottom-color:var(--blue)}
.split{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:18px;align-items:start}
.lp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.lp .flt{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.lp .items{overflow:auto}.item{padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.item:hover{background:#FAFBFC}.item.on{background:var(--blue-l);box-shadow:inset 3px 0 var(--blue)}
.item .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.item .t b{font-size:13px}.item .c{margin:3px 0 1px;font-weight:600}.item .m{font-size:12px;color:var(--mut)}
.flag{color:var(--red);font-size:12px;font-weight:600}
.back{display:none;margin-bottom:12px}

/* detail: kartu indeks */
.kartu{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.k-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 22px 16px;border-top:6px solid var(--blue);
  background:repeating-linear-gradient(#fff 0 27px,#EEF2F4 27px 28px)}
.k-no{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.k-cust{font-size:16px;font-weight:600;margin-top:4px}.k-meta{font-size:12.5px;color:var(--mut);margin-top:2px}
.k-fig{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.k-fig div{padding:12px 22px;border-right:1px solid var(--line2)}.k-fig div:last-child{border-right:0}.k-fig small{display:block;font-size:12px;color:var(--mut)}.k-fig b{font-size:17px}
.ruler{list-style:none;margin:0;padding:16px 22px 18px;display:grid;grid-template-columns:repeat(4,1fr);counter-reset:s}
.ruler li{position:relative;padding-top:20px;font-size:12.5px;color:var(--mut)}.ruler li b{display:block;color:var(--ink2);font-size:13px}
.ruler li::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--line)}
.ruler li::after{content:"";position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.ruler li.done::before{background:var(--blue)}.ruler li.done::after{background:var(--blue);box-shadow:none}
.ruler li.now::after{background:radial-gradient(circle,var(--brand-red) 0 2.5px,#fff 3px);box-shadow:inset 0 0 0 3px var(--blue)}.ruler li.now b{color:var(--blue-d)}
.ruler li.bad::after{background:var(--red);box-shadow:none}.ruler li.bad b{color:var(--red)}
.k-body{padding:4px 22px 22px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -22px 16px;padding:0 22px;overflow-x:auto}
.ptabs button{border:0;background:none;padding:11px 12px;font-size:13px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button.on{color:var(--blue-d);border-bottom-color:var(--blue)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line2);font-size:13px}.tl li span{color:var(--mut);font-size:12px}
.prog{height:8px;border-radius:4px;background:var(--line2);margin:8px 0 10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
.teamh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 2px}.teamh h3{margin:0;font-size:14px;color:var(--ink)}

/* form */
label{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #C5CDD7;border-radius:var(--r-s);font:inherit;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
input.bad,select.bad{border-color:var(--red);background:#FFF8F8}.ferr{color:var(--red);font-size:12px;margin-top:4px;font-weight:600}
input.ro{background:#F3F5F7;color:var(--ink2)}
.rpw{position:relative}.rpw span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;pointer-events:none}.rpw input{padding-left:34px;text-align:right}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 18px}.steps button{border:0;background:none;padding:0;text-align:left;font-size:12.5px;color:var(--mut);font-weight:600}
.steps i{display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}.steps .d i{background:var(--blue)}.steps .c{color:var(--ink)}
.ta{border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 16px;margin-bottom:14px;background:#FAFBFC}
.ta .h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px}
.orang{border-top:1px dashed var(--line);margin-top:14px;padding-top:4px}
.sum{position:sticky;top:16px}.sum td{font-size:12.5px;padding:6px 4px}
.seg{display:flex;flex-direction:column;gap:6px}.seg label,.chk{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer}
.seg input,.chk input{width:auto;margin:0;accent-color:var(--blue)}
.pnw{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pnw input{width:84px;flex:none}.pnw select{width:auto;flex:none}.pnw span{color:var(--mut);white-space:nowrap;font-size:13px}
.mdx{font-weight:500;margin-left:6px;white-space:nowrap;color:var(--mut)}.mdx input{width:auto;margin:0 3px 0 0;vertical-align:middle;accent-color:var(--blue)}
.note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--amber-l);border:1px solid #EBC98A;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px}

/* dialog, pdf, toast */
.ovl{position:fixed;inset:0;background:rgba(26,34,48,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.dlg{background:#fff;border-radius:12px;width:min(440px,100%);padding:22px;box-shadow:0 20px 50px rgba(26,34,48,.25)}.dlg p{margin:6px 0 0;color:var(--ink2);white-space:pre-line}
.pvBox{background:#fff;border-radius:12px;width:min(1000px,100%);height:min(92vh,1100px);display:flex;flex-direction:column;overflow:hidden}
.pvHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#pvFrame{flex:1;border:0;width:100%;background:#525659}.pvNote{font-size:11.5px;color:var(--mut);padding:6px 14px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;max-width:90vw;white-space:pre-line;display:none;z-index:50;box-shadow:0 8px 24px rgba(26,34,48,.3)}
#toast.err{background:var(--red)}

/* login */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
#login .card{width:100%;max-width:400px;padding:30px}#login .card{border-top:6px solid var(--blue)}#login .card .btn.b{background:var(--blue)}

/* master */
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs button.on{color:var(--blue-d);border-bottom-color:var(--blue)}
.mt{overflow:auto}.mt td{padding:4px 3px;border:0}.mt input,.mt select{padding:7px 9px;font-size:13px;min-width:90px}

@media (max-width:1400px){.split.det{grid-template-columns:minmax(0,1fr)}.split.det .lp{display:none}.split.det .back{display:inline-flex}}
@media (max-width:1100px){.fwrap{grid-template-columns:1fr}.sum{position:static}.grid2{grid-template-columns:1fr}.k-fig{grid-template-columns:1fr 1fr}.k-fig div:nth-child(2){border-right:0}.k-fig div:nth-child(-n+2){border-bottom:1px solid var(--line2)}}
@media (max-width:820px){
 #nav{inset:auto 0 0 0;width:auto;height:64px;flex-direction:row;padding:4px 6px;justify-content:space-around;border-right:0;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(26,34,48,.06)}
 .brand,.me,.full,#nav .nb.lain{display:none}#nav #navMore{display:flex}
 #nav .nb{flex-direction:column;gap:3px;font-size:11px;padding:7px 2px;width:auto;flex:1;text-align:center}#nav .nb.on::before{display:none}
 .badge{position:absolute;top:2px;right:22%;font-size:10px;padding:0 5px;line-height:16px}
 #main{margin:0;padding:10px 14px 90px}h1{font-size:21px}
 #mtop{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}#mtop img{height:24px;width:auto}#mtop b{font-size:14px;font-weight:700;color:var(--ink2);padding-left:10px;border-left:1px solid var(--line)}
 .split{grid-template-columns:minmax(0,1fr)}.lp{position:static;max-height:none}
 .split.det .lp{display:none}.split:not(.det) .dp{display:none}.back{display:inline-flex}
 .row3{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}
 .k-top,.k-body{padding-left:16px;padding-right:16px}.k-fig div{padding:10px 16px}.ruler{padding:14px 16px;grid-template-columns:repeat(4,1fr)}.ruler li{font-size:11px}.ptabs{margin:0 -16px 14px;padding:0 16px}
 .tl li{grid-template-columns:1fr}
}
#moreSheet{position:fixed;left:8px;right:8px;bottom:72px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(26,34,48,.18);padding:8px;display:none;z-index:30}
#moreSheet button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:var(--r-s);font-weight:600}#moreSheet button:hover{background:var(--bg)}
#moreSheet .who{padding:8px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line2);margin-bottom:4px}
</style></head>

<div id="login"><div class="card">
  <img class="lglogo" data-logo="LOGO_FULL" alt="Abdullah Fitriantoro &amp; Rekan">

const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>Number(x)||0,rp=x=>'Rp'+Math.round(num(x)).toLocaleString('id-ID'),pc=x=>(num(x)*100).toFixed(2).replace('.',',')+'%';
const ribu=x=>{const d=String(x==null?'':x).replace(/\D/g,'');return d?Number(d).toLocaleString('id-ID'):''};
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const tgl=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?(+m[3])+' '+BLN[m[2]-1]+' '+m[1]:esc(s)};
const jam=s=>{const m=String(s||'').match(/ (\d{2}:\d{2})$/);return m?m[1]:''};
const hariIni=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const titleCase=s=>String(s).toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const STL={DRAFT:'Draft',MENUNGGU:'Menunggu',DISETUJUI:'Disetujui',DITOLAK:'Ditolak'};
const pill=st=>`<span class="pill st-${esc(st)}">${STL[st]||esc(st)}</span>`;
const lunas=belum=>belum?'<span class="pill st-BELUM">Belum lunas</span>':'<span class="pill st-LUNAS">Lunas</span>';
const skel=n=>'<div class="card">'+Array.from({length:n||5},(_,i)=>`<span class="skel" style="width:${[60,90,75,85,50][i%5]}%"></span>`).join('')+'</div>';
let TOKEN=null;try{TOKEN=localStorage.getItem('kp_token')}catch(e){}
const store=t=>{TOKEN=t;try{t?localStorage.setItem('kp_token',t):localStorage.removeItem('kp_token')}catch(e){}};
function toast(t,err){const e=$('toast');e.textContent=t;e.className=err?'err':'';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',err?6000:3500)}
/** Ke server: di dalam Apps Script pakai google.script.run; di aplikasi terpasang (KP_API) pakai fetch tanpa cookie Google. */
function gs(fn,...a){
  if(!window.KP_API)return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
  return fetch(window.KP_API,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})})
    .then(r=>{if(!r.ok)throw new Error('Server tidak bisa dihubungi ('+r.status+'). Coba lagi.');return r.json()},()=>{throw new Error(navigator.onLine?'Server tidak bisa dihubungi. Coba lagi.':'Tidak ada koneksi internet.')})
    .then(r=>{if(!r.ok)throw new Error(r.error);return r.result})}
async function call(fn,...args){const r=await gs('api',TOKEN,fn,args);if(r&&r.__login){store(null);showLogin(r.error);throw new Error(r.error)}return r}
const fail=e=>{if(e&&e.message)toast(e.message,true)};
/** Dialog konfirmasi (pengganti confirm bawaan browser). */
function konfirm(judul,pesan,ok,bahaya){return new Promise(res=>{const o=$('dlgOvl');$('dlgT').textContent=judul;$('dlgP').textContent=pesan||'';

async function pdf(){const b=$('btnPdf');b.disabled=true;b.textContent='Menyiapkan PDF…';

    const bin=atob(r.b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);

function mdTim(t){if(!t.tglMulai||!t.tglSelesai||t.tglSelesai<t.tglMulai)return null;let md=0,hari=0,dobel=0;
  for(let d=new Date(t.tglMulai+'T00:00');d<=new Date(t.tglSelesai+'T00:00')&&hari<400;d.setDate(d.getDate()+1)){hari++;
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(d.getDay()===0||(O.libur&&O.libur[k]!==undefined)){md+=2;dobel++}else md++}
  return{md,hari,dobel}}

      h+=(nOrang()<O.maxTA?`<div class="btns"><button class="btn" onclick="addOrang(${ti})">Tambah tenaga ahli</button></div>`:'')+'</div>'});
    h+=`<button class="btn" onclick="addTim()">Tambah lokasi / tim</button>`}
  if(STEP===3){h+='<div class="sub" style="margin:0 0 12px">Hotel dan transport dihitung per tim. Kosongkan bila tidak ada.</div>';
    S.tim.forEach((t,ti)=>{h+=`<div class="ta"><div class="h"><b>Tim ${ti+1}: ${esc(t.lokasi||'lokasi belum diisi')}</b><span style="font-size:12.5px;color:var(--mut)">${t.orang.filter(o=>o.nama).map(o=>esc(o.nama)).join(', ')}</span></div>
      <h3>Hotel</h3><div class="row3">${numIn(`data-t="${ti}" data-h="malam" data-k="malam"`,'Malam',t.hotel.malam)}${numIn(`data-t="${ti}" data-h="kamar" data-k="kamar"`,'Kamar',t.hotel.kamar)}${rpIn(`data-t="${ti}" data-h="rate" data-k="rate"`,'Rate per malam',t.hotel.rate)}</div>
      <h3>Transport</h3>`;
      t.transport.forEach((x,xi)=>{h+=`<div class="row3"><div><label>Jenis</label><input data-t="${ti}" data-x="${xi}" data-k="jenis" value="${esc(x.jenis)}" placeholder="Pesawat, BBM + tol, sewa mobil"></div>${numIn(`data-t="${ti}" data-x="${xi}" data-k="qty"`,'Qty',x.qty)}${rpIn(`data-t="${ti}" data-x="${xi}" data-k="rate"`,'Rate'+(t.transport.length>1?` <button class="x" onclick="rmTr(${ti},${xi})">Hapus</button>`:''),x.rate)}</div>`});
      h+=`<div class="btns"><button class="btn" onclick="addTr(${ti})">Tambah jenis transport</button></div><div class="pv" id="tv${ti}"></div></div>`})}
  if(STEP===4)h+='<div id="review"><span class="skel"></span><span class="skel" style="width:70%"></span></div>';
  h+=`<div class="btns" style="margin-top:20px">${STEP>1?'<button class="btn" onclick="nav(-1)">← Kembali</button>':'<button class="btn" onclick="batal()">Batal</button>'}${STEP<4?'<button class="btn p" onclick="nav(1)">Lanjut</button>':`<button class="btn b" id="sv" onclick="save()">${S.id?'Simpan perubahan':'Simpan proyek'}</button>`}</div><div class="msg" id="msg" role="status"></div></div>
  <aside class="card sum" aria-label="Ringkasan hitungan"><h2>Ringkasan hitungan</h2><div id="sum" style="font-size:13px;color:var(--mut)">Isi fee dan tenaga ahli untuk melihat hitungan.</div></aside></div>`;
  $('main').innerHTML=h;
  document.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>{const s=+b.dataset.s;if(s<STEP){STEP=s;form()}else{while(STEP<s&&check())STEP++;form()}});
  live();preview()}
async function batal(){if(DIRTY&&!await konfirm('Batalkan isian?',S.id?'Perubahan tidak disimpan.':'Isian proyek baru dan drafnya akan dibuang.','Ya, batalkan',true))return;
  const id=S.id;if(!id)hapusDraf();S=null;DIRTY=false;if(id)openFrom('daftar',id);else go('home')}
/** Validasi per langkah: tandai kolom yang salah dan gulir ke sana. */
function check(){const e=[],add=(sel,m)=>e.push({sel,m});
  if(STEP===1){if(!S.divisi)add('#f_divisi','Pilih divisi.');
    if(!/^\d{1,4}$/.test(String(S.penawaranNo||'').trim()))add('#f_penawaranNo','Isi nomor penawaran (1-4 angka).');
    if(!/^\d{4}$/.test(String(S.penawaranThn||'')))add('#f_penawaranThn','Tahun 4 angka.');
    if(!String(S.customer||'').trim())add('#f_customer','Isi pemberi tugas.');if(!(num(S.feeInput)>0))add('#f_feeInput','Isi fee jasa.')}
  if(STEP===2)S.tim.forEach((t,i)=>{const o=t.orang.filter(x=>x.nama);
    if(!String(t.lokasi||'').trim())add('#lok'+i,'Isi lokasi aset tim '+(i+1)+'.');
    if(!o.length)add(`[data-t="${i}"][data-o="0"][data-k="nama"]`,'Pilih minimal satu tenaga ahli.');
    t.orang.forEach((x,j)=>{if(x.nama&&!(num(x.md)>0))add(`[data-t="${i}"][data-o="${j}"][data-k="md"]`,'Isi man-day.')});
    if(t.tglMulai&&t.tglSelesai&&t.tglSelesai<t.tglMulai)add(`[data-t="${i}"][data-k="tglSelesai"]`,'Tanggal selesai sebelum tanggal mulai.')});
  document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));document.querySelectorAll('.ferr').forEach(x=>x.remove());
  if(!e.length){msg('');return true}
  e.forEach(x=>{const el=document.querySelector(x.sel);if(!el)return;el.classList.add('bad');el.setAttribute('aria-invalid','true');
    const host=el.closest('.pnw,.rpw')||el;host.insertAdjacentHTML('afterend',`<div class="ferr">${esc(x.m)}</div>`)});
  const f=document.querySelector('.bad');if(f){f.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>f.focus({preventScroll:true}),250)}
  msg(e.length+' isian perlu diperbaiki.','err');return false}
function nav(d){if(d>0&&!check())return;STEP+=d;simpanDraf();form();window.scrollTo(0,0)}
async function rmTim(i){if(!await konfirm('Hapus tim '+(i+1)+'?','Lokasi, tenaga ahli, hotel, dan transport tim ini ikut terhapus.','Hapus tim',true))return;S.tim.splice(i,1);DIRTY=true;simpanDraf();form()}
function addTim(){S.tim.push(blankTim());DIRTY=true;form();const n=$('lok'+(S.tim.length-1));if(n){n.scrollIntoView({block:'center'});n.focus()}}
function addOrang(t){if(nOrang()>=O.maxTA){msg('Maksimal '+O.maxTA+' tenaga ahli.','err');return}S.tim[t].orang.push(blankOrang());DIRTY=true;form()}
function rmOrang(t,o){S.tim[t].orang.splice(o,1);DIRTY=true;form()}
function addTr(t){S.tim[t].transport.push({jenis:'',qty:'',rate:''});DIRTY=true;form()}function rmTr(t,x){S.tim[t].transport.splice(x,1);DIRTY=true;form()}
function live(){const f=$('feeinfo');
  if(f){const fi=num(S.feeInput),ex=S.feePPN==='YA'?fi/(1+O.ppn):fi;f.innerHTML=fi?`Fee excl. PPN <b>${rp(ex)}</b>, incl. PPN <b>${rp(ex*(1+O.ppn))}</b>.${S.feeTA==='TIDAK'?' Transport dan akomodasi di-reimburse oleh klien (dicatat di kartu).':''}`:'Isi fee jasa untuk melihat nilai exclude dan include PPN.'}
  S.tim.forEach((t,ti)=>{t.orang.forEach((o,oi)=>{const e=$('pv'+ti+'_'+oi);if(e)e.innerHTML=o.nama?`${esc(kualOf(o.nama))}, rate ${rp(rate(o))}, allowance <b>${rp(rate(o)*num(o.md))}</b>`:'Pilih nama tenaga ahli.'});
    const v=$('tv'+ti);if(v){const ho=num(t.hotel.malam)*num(t.hotel.kamar)*num(t.hotel.rate),tr=t.transport.reduce((s,x)=>s+num(x.qty)*num(x.rate),0);v.innerHTML=`Hotel ${rp(ho)}, transport ${rp(tr)}. <b>Total tim ${rp(ho+tr)}</b>`}})}
async function preview(){const el=$('sum');if(!el||!S)return;if(!num(S.feeInput)&&!S.tim.some(t=>t.orang.some(o=>o.nama)))return;
  let h;try{h=await call('previewHitung',S)}catch(e){return}PV=h;const e=$('sum');if(!e)return;
  const R=(l,v,b)=>`<tr${b?' class="tot"':''}><td>${l}</td><td class="n">${v}</td></tr>`;
  e.style.color='';e.innerHTML=`<table>${R('Allowance',rp(h.allowance))+R('Hotel & transport',rp(h.transport))+R('Anggaran survey',rp(h.anggaran),1)+R('Fee excl. PPN',rp(h.feeExcl))+R('Fee incl. PPN',rp(h.feeIncl))+R('Net fee',rp(h.net))+R('TP marketing',rp(h.tpMarketing))+R('Sign fee',rp(h.signFee))+R('Komisi',rp(h.komisi))+R('Expert fee',rp(h.expertFee))+R('PPN',rp(h.ppn))+R('PPh',rp(h.pph))+R('Total biaya, PPN & PPh',rp(h.totalBiaya)+'<br><small>'+pc(h.totalBiayaPct)+'</small>',1)+R('Porsi perusahaan',rp(h.porsi)+'<br><small>'+pc(h.porsiPct)+'</small>',1)}</table>`;
  const rv=$('review');if(rv){rv.innerHTML=`<h2>Periksa sebelum simpan</h2><table class="kv"><tr><td>No. penawaran</td><td><b>${esc(String(S.penawaranNo).padStart(4,'0')+O.kodePenawaran+S.penawaranBln+'/'+S.penawaranThn)}</b></td></tr><tr><td>Pemberi tugas</td><td>${esc(S.customer)}</td></tr><tr><td>Fee</td><td>${esc(catatanFee({feeInput:S.feeInput,feePPN:S.feePPN,feeTA:S.feeTA}))}</td></tr></table>
    ${h.biayaTim.map((b,i)=>{const t=S.tim[i]||{orang:[]};return`<h3>Tim ${i+1}: ${esc(b.lokasi)}${t.jenisAset||t.tglMulai?' <span style="font-weight:500;color:var(--mut)">('+esc([t.jenisAset,t.tglMulai?tgl(t.tglMulai)+' s/d '+tgl(t.tglSelesai):''].filter(String).join(', '))+')</span>':''}</h3><table>${t.orang.filter(o=>o.nama).map(o=>`<tr><td>${esc(o.nama)} (${o.lkdk}, ${num(o.md)} MD)</td><td class="n">${rp(rate(o)*num(o.md)+(rate(o)*num(o.md)?num(o.tata)+num(o.cadangan):0))}</td></tr>`).join('')}
    ${b.hotel?`<tr><td>Hotel ${b.malam} malam × ${b.kamar} kamar</td><td class="n">${rp(b.hotel)}</td></tr>`:''}${b.transport.map(x=>`<tr><td>${esc(x.jenis||'Transport')} ${x.qty} × ${rp(x.rate)}</td><td class="n">${rp(x.total)}</td></tr>`).join('')}</table>`}).join('')}`}}
let dT=null;
function onIn(e){const t=e.target,k=t.dataset.k;if(!k||!S||!t.closest('.fwrap'))return;
  let v=t.type==='checkbox'?t.checked:t.value;
  if(t.classList.contains('rp')){v=String(v).replace(/\D/g,'');const f=ribu(v);if(t.value!==f){t.value=f;try{t.setSelectionRange(f.length,f.length)}catch(x){}}}
  if(t.classList.contains('bad')){t.classList.remove('bad');t.removeAttribute('aria-invalid');const n=(t.closest('.pnw,.rpw')||t).nextElementSibling;if(n&&n.classList.contains('ferr'))n.remove()}
  if(t.dataset.h!==undefined)S.tim[+t.dataset.t].hotel[t.dataset.h]=v;
  else if(t.dataset.t!==undefined){const tm=S.tim[+t.dataset.t];
    if(t.dataset.o!==undefined)tm.orang[+t.dataset.o][k]=v;else if(t.dataset.x!==undefined)tm.transport[+t.dataset.x][k]=v;else tm[k]=v}
  else S[k]=v;
  DIRTY=true;clearTimeout(dT);dT=setTimeout(simpanDraf,800);
  if(k==='divisi')S.tim.forEach(tm=>tm.orang.forEach(o=>{if(o.nama&&!taList().includes(o.nama))o.nama=''}));
  if(k==='penawaranTgl'&&v){const d=new Date(v+'T00:00');S.penawaranBln=O.bulan[d.getMonth()];S.penawaranThn=String(d.getFullYear());const b=document.querySelector('[data-k=penawaranBln]'),y=document.querySelector('[data-k=penawaranThn]');if(b)b.value=S.penawaranBln;if(y)y.value=S.penawaranThn}
  if(k==='pemilikSama'||k==='penggunaSama'){form();return}
  if((k==='tglMulai'||k==='tglSelesai')&&t.dataset.t!==undefined){terapkanMD();if(e.type==='change'){const y=scrollY;form();scrollTo(0,y);return}}
  if(k==='mdManual'){terapkanMD();const y=scrollY;form();scrollTo(0,y);return}
  live();clearTimeout(pvT);pvT=setTimeout(preview,500)}
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
async function save(){const b=$('sv');b.disabled=true;b.textContent='Menyimpan…';let r;
  try{r=await call('simpanProyek',S)}catch(e){b.disabled=false;b.textContent='Simpan';msg(e.message,'err');return}
  b.disabled=false;b.textContent='Simpan';if(!r.ok){msg(r.errors.join('\n'),'err');return}
  if(!S.id)hapusDraf();S=null;DIRTY=false;await refreshList();V='daftar';SEL=r.id;DTAB='ring';go('daftar');
  setTimeout(()=>toast('Tersimpan sebagai '+r.id+'.'+(r.note?'\n'+r.note:'')),300)}

/* ---------- rekap ---------- */
function rekap(){const L=LV(),sum=(l,k)=>l.reduce((s,x)=>s+num(x[k]),0);
  const row=(n,l)=>`<tr><td>${n}</td><td class="n">${l.length}</td><td class="n">${rp(sum(l,'feeExcl'))}</td><td class="n">${rp(sum(l,'anggaran'))}</td><td class="n">${rp(sum(l,'porsi'))}</td></tr>`;
  const head='<tr><th></th><th class="n">Proyek</th><th class="n">Fee excl. PPN</th><th class="n">Anggaran survey</th><th class="n">Porsi perusahaan</th></tr>';
  const ok=L.filter(x=>x.status==='DISETUJUI'),go1=x=>`onclick="openFrom('daftar','${esc(x.id)}','bayar')" style="cursor:pointer"`;
  $('main').innerHTML=`<h1>Rekap ${O.tahun}</h1><div class="sub">Dihitung dari kartu proyek${DV?' '+esc(titleCase(DV)):''}.</div>${divTabs()}
  <div class="card"><h2>Per status</h2><div class="scroll"><table>${head}${['DRAFT','MENUNGGU','DISETUJUI','DITOLAK'].map(s=>row(pill(s),L.filter(x=>x.status===s))).join('')}<tr class="tot">${row('Total',L).slice(4)}</table></div></div>
  <div class="card" style="margin-top:16px"><h2>Disetujui per divisi</h2><div class="scroll"><table>${head}${(DV?[DV]:O.divisiLihat).map(d=>row(esc(titleCase(d)),ok.filter(x=>x.divisi===d))).join('')}<tr class="tot">${row('Total',ok).slice(4)}</table></div></div>
  <div class="card" style="margin-top:16px"><h2>Status pembayaran</h2>${(l=>l.length?`<div class="scroll"><table><tr><th>No. kartu</th><th>Pemberi tugas</th><th class="n">Anggaran</th><th class="n">Dibayar</th><th class="n">Sisa</th><th>Status</th></tr>
  ${l.map(x=>`<tr ${go1(x)}><td><b>${esc(x.id)}</b></td><td>${esc(x.customer)}</td><td class="n">${rp(x.anggaran)}</td><td class="n">${rp(x.dibayar)}</td><td class="n">${rp(x.sisaBayar)}</td><td>${lunas(x.belumBayar)}</td></tr>`).join('')}
  <tr class="tot"><td colspan="2">Total</td><td class="n">${rp(sum(l,'anggaran'))}</td><td class="n">${rp(sum(l,'dibayar'))}</td><td class="n">${rp(sum(l,'sisaBayar'))}</td><td></td></tr></table></div>`:'<div class="empty"><b>Belum ada proyek disetujui</b></div>')(ok.slice().sort((a,b)=>b.sisaBayar-a.sisaBayar))}</div>
  <div class="card" style="margin-top:16px"><h2>Disetujui tanpa ID Project</h2>${(l=>l.length?`<div class="scroll"><table><tr><th>No. kartu</th><th>Pemberi tugas</th><th class="n">Anggaran</th></tr>${l.map(x=>`<tr ${go1(x)}><td><b>${esc(x.id)}</b></td><td>${esc(x.customer)}</td><td class="n">${rp(x.anggaran)}</td></tr>`).join('')}</table></div>`:'<div class="empty"><b>Semua sudah punya ID Project</b></div>')(ok.filter(x=>!x.idProject))}</div>`}

/* ---------- master (admin) ---------- */
const MT={USERS:'Pengguna',TA:'Tenaga ahli',TARIF:'Tarif',PARAM:'Parameter',LIBUR:'Hari libur'};
const MHELP={LIBUR:'Hari libur nasional dan cuti bersama. Survey pada tanggal ini (dan hari Minggu) dihitung 2 man-day.',USERS:'Satu baris per orang per divisi. Penyusun dan manajer wajib punya divisi; keuangan dan admin divisinya dikosongkan. Hanya email di sini yang bisa masuk.',
  TA:'Kualifikasi harus ada di Tarif. Divisi kosong berarti bisa dipilih semua divisi. AKTIF = TIDAK untuk menyembunyikan.',TARIF:'Rate per man-day untuk dalam kota (DK) dan luar kota (LK).',
  PARAM:'Persentase boleh ditulis 11% atau 0,11. Kunci tidak boleh dihapus. Perubahan berlaku untuk proyek yang disimpan setelahnya.'};
async function master(key){if(!O.akses.admin){$('main').innerHTML='<div class="card empty"><b>Khusus admin</b></div>';return}M.key=key||M.key;
  $('main').innerHTML=`<h1>Master</h1><div class="sub">Data acuan untuk semua kartu proyek.</div><div class="tabs" role="tablist">${Object.keys(MT).map(k=>`<button role="tab" aria-selected="${k===M.key}" data-k="${k}" class="${k===M.key?'on':''}">${MT[k]}</button>`).join('')}</div><div class="card" id="mc">${skel(5).replace('<div class="card">','<div>')}</div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>master(b.dataset.k));
  try{M.data=await call('getMaster',M.key)}catch(e){fail(e);return}mdraw()}
function mcell(k,ci,v,ri){const d=M.data,o=(list,blank)=>`<select data-r="${ri}" data-c="${ci}">${blank?'<option value=""></option>':''}${list.map(x=>`<option${String(x)===String(v)?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
  if(k==='LIBUR'&&ci===0)return`<input type="date" data-r="${ri}" data-c="0" value="${esc(v)}">`;
  if(k==='USERS'&&ci===3)return o(d.divisi,1);if(k==='USERS'&&ci===4)return o(d.peran);
  if(k==='TA'&&ci===1)return o(d.kualifikasi,1);if(k==='TA'&&ci===2)return o(d.divisi,1);if(k==='TA'&&ci===3)return o(['YA','TIDAK']);
  if(k==='PARAM'&&ci===0){const fixed=['PPN','PPH','TP_MARKETING','SIGN_FEE','KOMISI','EXPERT_FEE','WAKTU_KONTRAK','KOTA'].includes(v);return fixed?`<b>${esc(v)}</b><input type="hidden" data-r="${ri}" data-c="0" value="${esc(v)}">`:`<input data-r="${ri}" data-c="0" value="${esc(v)}">`}
  const t=k==='TARIF'&&ci>0?'number':(k==='USERS'&&ci===0?'email':'text');
  return`<input type="${t}" data-r="${ri}" data-c="${ci}" value="${esc(v)}" aria-label="${esc(d.cols[ci])}">`}
function mdraw(){const k=M.key,d=M.data;
  $('mc').innerHTML=`<div style="font-size:13px;color:var(--mut);margin-bottom:10px">${MHELP[k]}</div><div class="mt"><table><tr>${d.cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr>
  ${d.rows.map((r,ri)=>`<tr>${d.cols.map((c,ci)=>`<td>${mcell(k,ci,r[ci],ri)}</td>`).join('')}<td>${k==='PARAM'?'':`<button class="x" onclick="mdel(${ri})">Hapus</button>`}</td></tr>`).join('')}</table></div>
  <div class="btns">${k==='PARAM'?'':'<button class="btn" onclick="madd()">Tambah baris</button>'}<button class="btn b" id="msv" onclick="msave()">Simpan ${MT[k].toLowerCase()}</button></div><div class="msg" id="msg" role="status"></div>`;
  document.querySelectorAll('#mc [data-r]').forEach(e=>{e.oninput=e.onchange=()=>{d.rows[+e.dataset.r][+e.dataset.c]=e.value}})}
function madd(){M.data.rows.push(M.data.cols.map(()=>''));mdraw();const l=document.querySelectorAll('#mc tr');l[l.length-1].querySelector('input,select').focus()}
function mdel(i){M.data.rows.splice(i,1);mdraw()}
async function msave(){const b=$('msv');b.disabled=true;msg('Menyimpan…');let r;
  try{r=await call('simpanMaster',M.key,M.data.rows)}catch(e){b.disabled=false;msg(e.message,'err');return}
  b.disabled=false;if(!r.ok){msg(r.errors.join('\n'),'err');return}
  O=await call('getInit');M.data=await call('getMaster',M.key);mdraw();toast(MT[M.key]+' disimpan.')}

start();
</script>
