<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartu Proyek</title>
<meta name="description" content="Kartu Proyek: anggaran survey KJPP AF&R">
<meta name="theme-color" content="#496570">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kartu Proyek">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#F3F5F7;font:14px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#1A2230}
  .layar{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  .layar img{width:72px;height:72px}
  #offline{display:none}
  #offline b{font-size:17px}
  .btn{border:0;background:#496570;color:#fff;font:inherit;font-weight:600;padding:10px 18px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
  .bar{width:120px;height:4px;border-radius:2px;background:#D9DEE5;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#496570;animation:b 1.1s ease-in-out infinite}
  @keyframes b{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
  .kecil{font-size:12.5px;color:#667085;max-width:300px}
</style>
</head>
<body>
<div class="layar" id="splash" aria-live="polite"><img src="icons/icon-192.png" alt=""><div class="bar" aria-hidden="true"><i></i></div><div>Membuka Kartu Proyek…</div>
  <a class="btn" id="manual" href="#" style="display:none">Buka Kartu Proyek</a></div>
<div class="layar" id="offline" role="alert"><img src="icons/icon-192.png" alt=""><b>Tidak ada koneksi internet</b>
  <div class="kecil">Kartu Proyek butuh internet untuk membaca dan menyimpan data.</div><button class="btn" onclick="buka()">Coba lagi</button></div>
<script>
  // Alamat web app Apps Script (STAGING). Ganti ke URL produksi saat rilis.
  // Dibuka langsung (bukan di dalam frame): Google memblokir Apps Script di dalam situs lain pada Chrome HP.
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwCTqDjLD3cFyOMkMcyhLnrV7ORKlEGhM_UukYVEMNhz_DGZ7_4o04WQgVPejawA-ri/exec';
  const splash = document.getElementById('splash'), off = document.getElementById('offline'), man = document.getElementById('manual');
  man.href = APP_URL;
  function buka() {
    if (!navigator.onLine) { off.style.display = 'flex'; splash.style.display = 'none'; return; }
    off.style.display = 'none'; splash.style.display = 'flex';
    location.replace(APP_URL);
    setTimeout(() => { man.style.display = 'inline-block'; }, 4000);   // cadangan bila pengalihan diblokir
  }
  window.addEventListener('online', () => { if (off.style.display === 'flex') buka(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  buka();
</script>
</body>
</html>
