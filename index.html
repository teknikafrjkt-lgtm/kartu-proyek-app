<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartu Proyek</title>
<meta name="description" content="Kartu Proyek: anggaran survey KJPP AF&R">
<meta name="theme-color" content="#1D5FA8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kartu Proyek">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#F3F5F7;font:14px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#1A2230}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);box-sizing:border-box;background:#F3F5F7}
  #splash,#offline{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  #splash img,#offline img{width:72px;height:72px}
  #offline{display:none;background:#F3F5F7}
  #offline b{font-size:17px}
  #offline button{border:0;background:#1D5FA8;color:#fff;font:inherit;font-weight:600;padding:9px 18px;border-radius:6px;cursor:pointer}
  .bar{width:120px;height:4px;border-radius:2px;background:#D9DEE5;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#1D5FA8;animation:b 1.1s ease-in-out infinite}
  @keyframes b{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div id="splash" aria-live="polite"><img src="icons/icon-192.png" alt=""><div class="bar" aria-hidden="true"><i></i></div><div>Membuka Kartu Proyek…</div></div>
<div id="offline" role="alert"><img src="icons/icon-192.png" alt=""><b>Tidak ada koneksi internet</b>
  <div>Kartu Proyek butuh internet untuk membaca dan menyimpan data.</div><button onclick="location.reload()">Coba lagi</button></div>
<iframe id="app" title="Kartu Proyek" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
<script>
  // Alamat web app Apps Script (STAGING). Ganti ke URL produksi saat rilis.
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwCTqDjLD3cFyOMkMcyhLnrV7ORKlEGhM_UukYVEMNhz_DGZ7_4o04WQgVPejawA-ri/exec';
  const app = document.getElementById('app'), splash = document.getElementById('splash'), off = document.getElementById('offline');
  function buka() {
    if (!navigator.onLine) { off.style.display = 'flex'; splash.style.display = 'none'; return; }
    off.style.display = 'none'; app.src = APP_URL;
  }
  app.addEventListener('load', () => { if (app.src) splash.style.display = 'none'; });
  window.addEventListener('offline', () => { off.style.display = 'flex'; });
  window.addEventListener('online', () => { if (off.style.display === 'flex') { splash.style.display = 'flex'; buka(); } });
  buka();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
